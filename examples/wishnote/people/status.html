<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>缄愿笔记 · 愿档</title><style>
:root{color-scheme:dark;--ink:#e8dfce;--muted:#b6a990;--line:#6e5e47}
body{margin:0;padding:16px;background:#201e23;color:var(--ink);font:14px/1.7 system-ui}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
h2{font-size:18px;letter-spacing:.15em;margin:0;color:#e4c894}small{color:var(--muted);font-size:11px}
section,details{border-left:2px solid var(--line);padding:3px 12px;margin:12px 0;background:#ffffff04}
h3,summary{font-size:13px;color:#d5bb90;margin:0;letter-spacing:.06em}summary{cursor:pointer;padding:5px 0}
p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:360px){body{padding:10px}header{display:block}section,details{padding-left:8px}}
</style></head><body>
<header><h2>缄愿笔记</h2><small>愿已成真 · 事实留存</small></header>
<article data-lore-person><h3><span data-lore-name></span> · <small data-lore-id></small></h3>
<section><h3>已成事实</h3><p data-lore-field="已成事实"></p></section>
<details open><summary>持续条件 · 恒与程</summary><p data-lore-field="持续条件"></p></details>
<details><summary>生效关联</summary><p data-lore-field="生效关联"></p></details>
</article></body></html>
