<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>世界手记</title><style>
body{margin:0;padding:16px;background:#242421;color:#e5dfd3;font:14px/1.6 system-ui}*{box-sizing:border-box}h2,h3,p{margin:0 0 8px}header,article{padding:12px;border:1px solid #736e60;border-radius:8px;margin-bottom:12px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}small,dt{color:#c2b79e}dd{margin:0 0 10px;overflow-wrap:anywhere}header{display:flex;flex-wrap:wrap;gap:12px}
</style></head><body><h2>世界手记</h2><header><div><small>地点</small><p data-lore-field="地点"></p></div><div><small>时间</small><p data-lore-field="时间"></p></div></header><main>
<article data-lore-entity><small data-lore-type></small><h3 data-lore-name></h3>
<section data-lore-module="人物"><dl><dt>身体状况</dt><dd data-lore-field="身体状况"></dd><dt>当前目标</dt><dd data-lore-field="当前目标"></dd></dl></section>
<section data-lore-module="物品"><dl><dt>持有者</dt><dd data-lore-field="持有者"></dd><dt>完好状况</dt><dd data-lore-field="完好状况"></dd></dl></section>
<section data-lore-module="国家"><dl><dt>政局</dt><dd data-lore-field="政局"></dd><dt>外交</dt><dd data-lore-field="外交"></dd></dl></section>
<section data-lore-module="事件"><dl><dt>事项</dt><dd data-lore-field="事项"></dd><dt>进展</dt><dd data-lore-field="进展"></dd></dl></section>
</article></main></body></html>
