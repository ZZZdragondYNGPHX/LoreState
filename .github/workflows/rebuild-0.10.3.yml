name: rebuild-0.10.3

on:
  push:
    branches:
      - fix/0.10.3-source-port

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[release-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Commit generated artifacts and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-0.10.3.yml
          git add artifact/bundle.js prototype/dist/main/lorestate-script.json prototype/dist/main/receipt.json
          git commit -m "Rebuild 0.10.3 artifacts [release-build]"
          git push origin HEAD:fix/0.10.3-source-port
