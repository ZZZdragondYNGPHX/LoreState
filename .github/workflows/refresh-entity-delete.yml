name: refresh entity-delete artifacts
on:
  push:
    branches: [feature/entity-delete]
permissions:
  contents: write
jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entity-delete
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact/bundle.js prototype/dist/main/lorestate-script.json prototype/dist/main/receipt.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: refresh entity-delete artifacts"
            git push origin HEAD:feature/entity-delete
          fi
